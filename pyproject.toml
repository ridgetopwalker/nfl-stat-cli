[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-stat-cli"
version = "2.0.0"
description = "Cross-platform (*nix & Windows) colorized ASCII art NFL analytics, play visualizer (behind-offense, behind-defense, sideline), & composable custom stat CLI powered by nflverse (R), sportsdataverse-py (Python), and optional local SLM (Ollama)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "Sean McClain", email = "dev@ridgetopwalker.com"}
]
dependencies = []

[project.optional-dependencies]
live = [
  "pandas>=2.0.0",
  "polars>=0.20.0",
  "pyarrow>=14.0.0",
  "nfl_data_py>=0.3.0",
  "sportsdataverse>=0.0.72",
]

[project.scripts]
nfl-stat-cli = "nfl_stat_cli:main"

[tool.setuptools]
py-modules = ["nfl_stat_cli"]
