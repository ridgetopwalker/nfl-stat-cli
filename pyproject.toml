[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-football-slm"
version = "2.0.0"
description = "Pro Football SLM: the American pro football stat engine. Cross-platform colorized terminal analytics, play visualizer, and composable custom stats (nflverse / sportsdataverse + optional local SLM)."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
  {name = "Sean McClain", email = "dev@ridgetopwalker.com"}
]
maintainers = [
  {name = "Sean McClain", email = "dev@ridgetopwalker.com"}
]
keywords = [
  "nfl",
  "football",
  "analytics",
  "statistics",
  "cli",
  "tui",
  "ascii-art",
  "nflverse",
  "sportsdataverse",
  "play-by-play",
  "pfslm",
  "pro-football-slm",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
live = [
  "pandas>=2.0.0",
  "polars>=0.20.0",
  "pyarrow>=14.0.0",
  "nfl_data_py>=0.3.0",
  "nflreadpy>=0.1.0",
  "sportsdataverse>=0.0.72",
]
dev = [
  "build>=1.0.0",
  "twine>=5.0.0",
  "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/ridgetopwalker/nfl-stat-cli"
Repository = "https://github.com/ridgetopwalker/nfl-stat-cli"
Issues = "https://github.com/ridgetopwalker/nfl-stat-cli/issues"
Changelog = "https://github.com/ridgetopwalker/nfl-stat-cli/releases"

[project.scripts]
pro-football-slm = "pro_football_slm:main"
pfslm = "pro_football_slm:main"
nfl-stat = "pro_football_slm.shim:main"

[tool.setuptools]
packages = ["pro_football_slm"]
package-data = {"pro_football_slm" = ["*.R", "*.json", "NOTICE.txt"]}
include-package-data = true
